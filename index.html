<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jüdisches Leben in Kleineicholzheim</title>
<style>
:root{--bg:#ffffff;--ink:#1b1917;--line:#1b1917;--mute:#8d877c;--acc:#8e2b1f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
.layout{display:grid;grid-template-columns:minmax(320px,28%) 1fr;grid-template-rows:1fr auto;gap:0 clamp(16px,3vw,48px);padding:clamp(24px,3.5vw,56px);min-height:100vh}
h1{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;font-size:clamp(1.9rem,2.7vw,3rem);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
h1 a{color:inherit;text-decoration:none}
nav{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:clamp(28px,4vw,60px)}
nav a{width:fit-content;border:1px solid transparent;border-radius:8px;padding:.35em .75em;margin-left:-.75em;font-size:clamp(.92rem,1.05vw,1.1rem);color:var(--ink);text-decoration:none;transition:.15s}
nav a:hover,nav a:focus-visible{background:none;color:var(--acc);outline:none}
nav a[aria-current],nav a[aria-current]:hover{background:none;border-color:var(--ink);color:var(--ink)}
.intro{font-size:clamp(.85rem,1.05vw,1.05rem);margin-bottom:8px}
svg.map{width:100%;height:auto;display:block;overflow:visible}
.h{font:500 42px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.005em}
.sb,.ad{font:400 37px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.town{font:500 34px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.04em;fill:#a39d92}
.part{transition:opacity .25s}
.map.hov .part:not(.on){opacity:.16}
.conn{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 18;transition:stroke .2s}
.conn.on{stroke:var(--acc);stroke-dasharray:none;stroke-width:4}
.lab{cursor:pointer;outline:none}
.lab .h{fill:var(--ink);transition:fill .2s}
.lab.on .h{fill:var(--acc)}
.hit{fill:transparent}
.dot{fill:var(--ink);transform-box:fill-box;transform-origin:center;transition:transform .22s,fill .2s}
.ring{fill:none;stroke:var(--acc);stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:.25s}
.cube.on .dot{fill:var(--acc);transform:scale(1.5)}
.cube.on .ring{opacity:1;transform:scale(1)}
.index{display:none;margin-top:20px}
.index button{all:unset;cursor:pointer;display:block;width:100%;padding:10px 0;border-bottom:1px solid #1112;font:500 1.05rem "Helvetica Neue",Helvetica,Arial,sans-serif}
.index button small{display:block;font:400 .85rem "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--mute)}
.page{max-width:82ch}
.page h2{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;font-size:clamp(1.1rem,1.35vw,1.4rem);line-height:1.08;margin-bottom:1.1em}
.page .sub{color:var(--mute);margin-bottom:1.2em}
.page p{margin-bottom:1em;white-space:pre-line;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.page h3{font:500 1.05rem "Helvetica Neue",Helvetica,Arial,sans-serif;margin:1.4em 0 .4em}
.page figure{margin:1.5em 0}.page figure img{width:100%;display:block}
.page figcaption{font-size:.85rem;color:var(--mute);margin-top:6px}
.page .infobox{border:1px solid var(--line);padding:14px 16px;margin:1.5em 0}
.page .infobox b{display:block;margin-bottom:6px}
[hidden]{display:none!important}
#modal{position:fixed;inset:0;background:#111c;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.open{display:flex}
.card{background:var(--bg);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:clamp(22px,4vw,44px);border:0;border-top:1px solid var(--ink);position:relative;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card .k{font-size:.8rem;color:var(--mute)}
.card h3{font:500 clamp(1.8rem,4vw,2.6rem)/1.05 "Helvetica Neue",Helvetica,Arial,sans-serif;margin:.5em 0 .25em}
.card .sub{color:var(--mute);white-space:pre-line}
.meta{margin:16px 0;font-size:.95rem;color:#111}
.card figure{margin:0 0 18px;clear:both}.card img{width:100%;display:block}
.card figure.klein{float:right;clear:right;width:36%;margin:4px 0 12px 22px}
.card figcaption{font-size:.82rem;color:var(--mute);margin-top:6px;line-height:1.35}
.card p+figure{margin-top:8px}
@media(max-width:520px){.card figure.klein{float:none;width:60%;margin:0 0 18px}}
.card h3+figure,.card .sub+figure,.card .meta+figure{margin-top:20px}
.card p{margin-bottom:1em}
.x{position:absolute;top:12px;right:14px;background:none;border:1px solid var(--line);width:34px;height:34px;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--line)}
.x:hover{background:var(--line);color:var(--bg)}
footer{grid-column:1/-1;margin-top:32px;padding-top:12px;border-top:1px solid #1b191733;display:flex;justify-content:flex-end;gap:20px;font-size:.82rem;color:var(--mute)}
footer a{color:inherit;text-decoration:none}footer a:hover{color:var(--line)}
@media(max-width:820px){
 .layout{grid-template-columns:1fr;padding:20px}
 .lab,.town,.conn{display:none}.index{display:block}
 nav a{font-size:.95rem}
}
</style>
</head>
<body>
<div class="layout">
  <header class="side">
    <h1><a href="#menschen-und-orte">Jüdisches Leben in Kleineicholzheim</a></h1>
    <nav aria-label="Hauptmenü" id="nav"></nav>
  </header>

  <main>
    <section id="view-map">
      <p class="intro">Die letzten Menschen, Familien und Orte der jüdischen Gemeinde vor ihrer Vertreibung und Ermordung durch das NS-Regime.<br>Wähle einen Punkt auf der Karte um mehr zu erfahren</p>
      <svg id="svg" class="map" viewBox="480 200 2200 1610" role="group" aria-label="Karte von Kleineicholzheim"></svg>
      <section class="index" aria-label="Verzeichnis"><ol id="list" style="list-style:none;padding:0"></ol></section>
    </section>
    <article id="view-page" class="page" hidden></article>
  </main>
  <footer><a href="#impressum">Impressum</a></footer>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card" id="card"></div></div>

<script src="houses.js"></script>
<script src="pages.js"></script>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg');
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.append(e);return e};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paras=t=>(t||'').split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('');
const INK='#1b1917';

/* Straßen, Bach, Grundstücke (aus der SVG-Zeichnung): [Pfad, Strichstärke] */
const ROADS=[["M1563.76,267.93c29.69,134.67,6.44,212.28-22.44,258.95-13.69,22.12-31.56,42.01-57.16,90.09-29.39,55.2-48.39,90.89-51.44,139.62-3.44,55,17.39,63.92,6.54,114.94-8.24,38.74-21.96,41.66-28.24,81.74-5.04,32.13,2.75,36.8,6.01,96.13,2.15,39.18,4.23,77.03-6.01,118.27-9.15,36.84-24.19,60.52-37.74,83.27,0,0,0,0,0,0-20.56,28.78-67.64,107.23-102.08,207.17-34.35,99.67-44.05,191.27-46.6,252.44", 14], ["M857.47,262.32c7.87,40.08,21.36,92.35,45.66,150.68,33.38,80.13,71.72,134.08,96.06,168.52,57.43,81.25,86.14,121.88,139.88,151.67,59.33,32.89,96.06,52.24,96.06,52.24,29.76,15.33,44.07,21.91,62.21,37.63,25.74,22.29,26.55,34.69,49.87,62.44,33.12,39.41,51.03,37.67,91.83,75.2,33.77,31.07,34.97,46.42,67.41,84.26,83.09,96.92,129.99,84.66,148.3,136.51,20.3,57.46-36.53,74.73-67.41,219.08-10.6,49.56-7.87,69.26-12.45,105.02-2.12,16.55-7.95,45.58-17.88,82.04-8.74,32.07-22.49,74.52-44.67,122.93", 3], ["M1927.79,797.17c-12.49,6.88-31.37,16.33-55.35,24.7-37.22,12.99-71.33,18.01-155.76,20.6-54.16,1.66-85.55,1-163.14.96-46.92-.02-84.95.2-108.76.38", 9], ["M1523.36,588.05l207.65,133.35v87.63l-9.53,123.83-66.68,7.62-51.44,156.21-110.49,108.59c-22.96-3.16-45.91-6.32-68.87-9.48", 3], ["M1417.03,1133.22c-53.16-18.48-106.32-36.97-159.48-55.45-3.93,22.36-7.86,44.72-11.79,67.08.88,37.96,1.77,75.92,2.65,113.87,24.45,26.11,48.9,52.22,73.35,78.33", 9], ["M1289.45,809c8.26-22.18,16.51-44.37,24.77-66.55h32.39l34.29-114.3,96.82-165.74c21.02,12.73,42.03,25.47,63.05,38.2", 3], ["M1245.77,1233.86v-83.82l-37.77-7.62,26.67-144.78h43.82c15.99-31.28,31.94-62.58,47.97-93.85l9.36-18.25", 3]];
const CREEK=1; /* Index des Baches in ROADS */
const LH=47; /* Zeilenabstand der Beschriftung */

function build(){
  svg.innerHTML='';
  const gMap=el('g',{},svg);
  ROADS.forEach(([d,w])=>el('path',{d,fill:'none',stroke:INK,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'},gMap));
  const creek=ROADS[CREEK][0];
  const cp=el('path',{d:creek,fill:'none'},gMap);
  const clen=cp.getTotalLength();

  /* Textblöcke messen */
  const probe=el('text',{class:'h',x:0,y:-999},svg);
  const wid=(s,cls)=>{probe.setAttribute('class',cls);probe.textContent=s;return probe.getComputedTextLength()};
  const LEFT_IDS=['samuel','mikwe','moses','elsa-berta','kaufmann','westheimer'];
  const wrap=(str,cls,max)=>{const w=str.split(' ');const out=[];let cur='';
    w.forEach(x=>{const t=cur?cur+' '+x:x;if(cur&&wid(t,cls)>max){out.push(cur);cur=x}else cur=t});
    if(cur)out.push(cur);return out};
  const items=HOUSES.map(h=>{
    const left=LEFT_IDS.includes(h.id),mx=left?470:700;
    const rows=[];
    wrap(h.titel,'h',mx).forEach(l=>rows.push([l,'h']));
    (h.untertitel?h.untertitel.split('\n'):[]).forEach(l=>wrap(l,'sb',mx).forEach(m=>rows.push([m,'sb'])));
    (h.adresse?h.adresse.split('\n'):[]).forEach(l=>wrap(l,'ad',mx).forEach(m=>rows.push([m,'ad'])));
    const hw=wid(rows[0][0],'h');
    const bw=Math.max(...rows.map(r=>wid(r[0],r[1])));
    return{h,id:h.id,x:h.x,y:h.y,rows,hw,bw,bh:(rows.length-1)*LH+30,hh:30,side:left?'L':'R'}
  });
  const t1=wid('Großeicholzheim','town'),t2=wid('Oberschefflenz','town'),t3=wid('Eberbach','town');
  probe.remove();

  /* Ortsnamen */
  const town=(s,x,y,extra={})=>{const e=el('text',{class:'town',x,y,...extra},gMap);e.textContent=s;return e};
  town('Großeicholzheim',1465.9,245.5);
  /* Eberbach: am Bach entlang, links neben der Linie */
  {const p0=cp.getPointAtLength(clen*.07);
   town('Eberbach',p0.x+18,p0.y-4)}
  town('Oberschefflenz',1037,1775);

  /* Spalten und Abstände, Linienkreuzungen minimieren */
  const XL=400,XR=2040,GAP=46,TOP=230,BOT=1800;
  const segX=(p,q,r,t)=>{const o=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
    return o(p,q,r)*o(p,q,t)<0&&o(r,t,p)*o(r,t,q)<0};
  const segRect=(p,q,r)=>{let t0=0,t1=1;const dx=q[0]-p[0],dy=q[1]-p[1];
    for(const[pp,qq]of[[-dx,p[0]-r[0]],[dx,r[2]-p[0]],[-dy,p[1]-r[1]],[dy,r[3]-p[1]]]){
      if(pp===0){if(qq<0)return false}else{const t=qq/pp;if(pp<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}}
    return true};
  ['L','R'].forEach(side=>{
    const L=items.filter(i=>i.side===side).sort((a,b)=>a.y-b.y);
    const place=()=>L.forEach(it=>{it.x0=side==='L'?XL:XR;it.ty=it.top+30;
      it.a=[side==='L'?it.x0+it.hw+16:it.x0-16,it.ty-13];it.b=[it.x,it.y]});
    const relax=()=>{
      L.forEach(it=>{it.top=it.y-it.hh});
      for(let r=0;r<3;r++){
        L.forEach((it,i)=>{it.top=Math.max(it.top,i?L[i-1].top+L[i-1].bh+GAP:TOP)});
        for(let i=L.length-1;i>=0;i--){const lim=i<L.length-1?L[i+1].top-GAP:BOT;L[i].top=Math.min(L[i].top,lim-L[i].bh)}
        L.forEach((it,i)=>{it.top=Math.max(it.top,i?L[i-1].top+L[i-1].bh+GAP:TOP)});
      }
      place();
    };
    const cost=()=>{let c=0,len=0;L.forEach((p,i)=>{len+=Math.hypot(p.a[0]-p.b[0],p.a[1]-p.b[1]);for(let j=i+1;j<L.length;j++)if(segX(p.a,p.b,L[j].a,L[j].b))c+=1;L.forEach(q=>{if(q!==p&&segRect(p.a,p.b,[q.x0-10,q.top-40,q.x0+q.bw+10,q.top+q.bh+10]))c+=1})});return c*10000+len};
    const feasible=()=>{for(let i=0;i<L.length;i++){const lo=i?L[i-1].top+L[i-1].bh+GAP:TOP;if(L[i].top<lo-.01)return false}const z=L[L.length-1];return z.top+z.bh<=BOT+.01};
    const tune=()=>{let best=cost();
      for(let pass=0;pass<14;pass++){let imp=false;
        for(let k=0;k<L.length;k++)for(const d of[-120,-60,-30,-15,15,30,60,120]){
          const old=L[k].top;L[k].top=old+d;
          if(!feasible()){L[k].top=old;continue}
          place();const c=cost();
          if(c<best-.5){best=c;imp=true}else{L[k].top=old}}
        place();if(!imp)break}
      place();return best};
    relax();let best=tune(),imp=true,guard=0;
    while(imp&&guard++<20){imp=false;
      for(let i=0;i<L.length-1;i++){[L[i],L[i+1]]=[L[i+1],L[i]];relax();const c=tune();
        if(c<best-.5){best=c;imp=true}else{[L[i],L[i+1]]=[L[i+1],L[i]];relax();tune()}}}
  });

  /* Ebenen: Linien, Punkte, Beschriftung */
  const gLines=el('g',{},svg),gDots=el('g',{},svg),gLabs=el('g',{},svg);
  const parts={};
  let minX=XL-20,maxX=0,minY=200,maxY=1810;
  items.forEach(it=>{maxX=Math.max(maxX,it.x0+it.bw+20)});
  [...items].sort((a,b)=>a.y-b.y).forEach(it=>{
    const cg=el('g',{class:'part cube'},gDots);
    el('circle',{class:'ring',cx:it.x,cy:it.y,r:26},cg);
    el('circle',{class:'dot',cx:it.x,cy:it.y,r:10},cg);
    el('circle',{class:'hit',cx:it.x,cy:it.y,r:30},cg);
    it.cube=cg;
  });
  items.forEach(it=>{
    const dx=it.a[0]-it.x,dy=it.a[1]-it.y,L=Math.hypot(dx,dy),s=26/L;
    const st=[it.x+dx*s,it.y+dy*s];
    const ln=el('path',{class:'part conn',d:`M${st[0].toFixed(1)},${st[1].toFixed(1)} L${it.a[0].toFixed(1)},${it.a[1].toFixed(1)}`},gLines);
    const lg=el('g',{class:'part lab',tabindex:0,role:'button','aria-label':it.h.titel+' – Details öffnen'},gLabs);
    el('rect',{class:'hit',x:it.x0-12,y:it.ty-40,width:it.bw+24,height:it.bh+14},lg);
    it.rows.forEach(([l,c],j)=>{const t=el('text',{class:c,x:it.x0,y:it.ty+j*LH},lg);t.textContent=l});
    parts[it.id]=[ln,lg,it.cube];
    const on=()=>{svg.classList.add('hov');parts[it.id].forEach(e=>e.classList.add('on'))};
    const off=()=>{svg.classList.remove('hov');parts[it.id].forEach(e=>e.classList.remove('on'))};
    [lg,it.cube].forEach(e=>{
      e.addEventListener('pointerenter',on);e.addEventListener('pointerleave',off);
      e.addEventListener('click',()=>open(it.h,lg));
      e.style.cursor='pointer';
    });
    lg.addEventListener('focus',on);lg.addEventListener('blur',off);
    lg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(it.h,lg)}});
  });
  svg.setAttribute('viewBox',`${minX} ${minY} ${maxX-minX} ${maxY-minY}`);
}

/* ---------- Verzeichnis (Handy) ---------- */
const list=document.getElementById('list');
HOUSES.forEach(h=>{const li=document.createElement('li');
  li.innerHTML=`<button>${esc(h.titel)}<small>${esc((h.adresse||'').replace(/\n/g,' · '))}</small></button>`;
  li.firstChild.onclick=()=>open(h,li.firstChild);list.append(li)});

/* ---------- Info-Fenster ---------- */
const modal=document.getElementById('modal'),card=document.getElementById('card');let last=null;
function open(h,from){
  last=from;
  const imgs=[].concat(h.fotos||h.foto||[]),used=new Set([0]);
  const im=i=>{const f=imgs[i];if(!f)return '';const src=typeof f==='string'?f:f.src,cap=typeof f==='string'?'':(f.unterschrift||''),kl=typeof f!=='string'&&f.groesse==='klein';
    return `<figure${kl?' class="klein"':''}><img src="${esc(src)}" alt="${esc(cap||h.titel)}" loading="lazy">${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`};
  const body=(h.text||'').split(/\n\s*\n/).map(par=>{let out='',buf=[];
    const flush=()=>{if(buf.length)out+=`<p>${esc(buf.join('\n'))}</p>`;buf=[]};
    par.split('\n').forEach(l=>{const m=l.trim().match(/^\{\{foto:(\d+)\}\}$/);if(m){flush();used.add(+m[1]);out+=im(+m[1])}else buf.push(l)});
    flush();return out}).join('');
  const tail=imgs.map((f,i)=>used.has(i)?'':im(i)).join('');
  const meta=[(h.adresse||'').replace(/\n/g,' · '),h.jahre].filter(Boolean).join('   ·   ');
  card.innerHTML=`<button class="x" aria-label="Schließen">×</button><div class="k">${esc(h.kategorie)}</div>
  <h3 id="mt">${esc(h.titel)}</h3><div class="sub">${esc(h.untertitel)}</div>
  ${meta?`<div class="meta">${esc(meta)}</div>`:''}${im(0)}${body}${tail}`;
  card.querySelector('.x').onclick=close;modal.classList.add('open');card.querySelector('.x').focus();
}
function close(){modal.classList.remove('open');last&&last.focus&&last.focus()}
modal.onclick=e=>{if(e.target===modal)close()};
addEventListener('keydown',e=>{if(e.key==='Escape')close()});

/* ---------- Menü & Seiten ---------- */
const MENU=[['juedische-geschichte-in-sueddeutschland'],['juedische-gemeinde-in-kleineicholzheim'],['ns-zeit-und-das-ende-der-gemeinde'],['menschen-und-orte','Menschen und Orte']];
const nav=document.getElementById('nav'),vm=document.getElementById('view-map'),vp=document.getElementById('view-page');
MENU.forEach(([slug,name])=>{const a=document.createElement('a');a.href='#'+slug;a.dataset.slug=slug;
  a.innerHTML=`<span>${esc(name||PAGES[slug].titel)}</span>`;nav.append(a)});
function render(b){
  if(b.typ==='ueberschrift')return `<h3>${esc(b.text)}</h3>`;
  if(b.typ==='bild')return `<figure><img src="${esc(b.src)}" alt="${esc(b.alt||'')}">${b.unterschrift?`<figcaption>${esc(b.unterschrift)}</figcaption>`:''}</figure>`;
  if(b.typ==='info')return `<div class="infobox"><b>${esc(b.titel)}</b>${(b.zeilen||[]).map(z=>`<div>${esc(z)}</div>`).join('')}</div>`;
  return paras(b.text);
}
function route(){
  const slug=location.hash.slice(1).split('?')[0]||'menschen-und-orte';
  const pg=PAGES[slug];modal.classList.remove('open');
  vm.hidden=!!pg;vp.hidden=!pg;
  if(pg){vp.innerHTML=`<h2>${esc(pg.titel)}</h2>${pg.untertitel?`<div class="sub">${esc(pg.untertitel)}</div>`:''}${pg.bloecke.map(render).join('')}`;
    document.title=pg.titel+' · Kleineicholzheim'}else document.title='Jüdisches Leben in Kleineicholzheim';
  nav.querySelectorAll('a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.slug===(pg?slug:'menschen-und-orte')));
  scrollTo(0,0);
}
addEventListener('hashchange',route);route();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{vm.hidden=false;build();route()});
</script>
