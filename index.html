<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jüdisches Leben in Kleineicholzheim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--ink:#111;--mute:#6d6a63;--acc:#d3201b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;line-height:1.55}
header{border-top:4px solid var(--ink);padding:clamp(20px,4vw,48px) clamp(20px,5vw,64px) 0}
.kicker{font:500 .72rem Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
h1{font:500 clamp(2.4rem,7vw,5.6rem)/.95 "Barlow Condensed",sans-serif;letter-spacing:-.01em;text-transform:none;margin:.3em 0 .25em}
.lead{max-width:48ch;color:var(--mute)}
.map{max-width:1320px;margin:0 auto;padding:0 clamp(8px,3vw,40px)}
svg{width:100%;height:auto;display:block;overflow:visible}
.road{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.item{cursor:pointer;outline:none;transition:opacity .25s}
.map:has(.item:hover) .item:not(:hover),.map:has(.item:focus-visible) .item:not(:focus-visible){opacity:.2}
.dot{fill:var(--ink);transform-box:fill-box;transform-origin:center;transition:transform .25s,fill .2s}
.ring{fill:none;stroke:var(--acc);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:.3s}
.lead-line{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:.1 7;stroke-linecap:round;transition:stroke .2s}
.lbl{font:400 22px "Barlow Condensed",sans-serif;fill:var(--ink);transition:fill .2s}
.lbl .t{font-weight:500}
.more{font-weight:600;fill:var(--acc);opacity:0;transition:opacity .25s;letter-spacing:.04em}
.item:hover .dot,.item:focus-visible .dot{transform:scale(1.9);fill:var(--acc)}
.item:hover .ring,.item:focus-visible .ring{opacity:1;transform:scale(1)}
.item:hover .lead-line,.item:focus-visible .lead-line{stroke:var(--acc);stroke-dasharray:none;stroke-width:2}
.item:hover .lbl,.item:focus-visible .lbl{fill:var(--acc)}
.item:hover .more,.item:focus-visible .more{opacity:1}
.hit{fill:transparent}
section.index{padding:0 clamp(20px,5vw,64px) 48px;max-width:1320px;margin:0 auto}
.index h2{font:500 .72rem Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding:18px 0 8px;border-top:1px solid var(--ink)}
.index ol{list-style:none;padding:0;columns:3 280px;column-gap:40px}
.index button{all:unset;cursor:pointer;display:block;width:100%;padding:8px 0;border-bottom:1px solid #1111;font:500 1.1rem "Barlow Condensed";break-inside:avoid}
.index button small{display:block;font:400 .9rem "Barlow Condensed";color:var(--mute)}
.index button:hover,.index button:focus-visible{color:var(--acc)}
#modal{position:fixed;inset:0;background:#111c;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.open{display:flex}
.card{background:var(--bg);max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:clamp(22px,4vw,44px);border-top:4px solid var(--ink);position:relative;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card .k{font:500 .72rem Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.card h3{font:500 clamp(2rem,5vw,3rem)/1 "Barlow Condensed",sans-serif;margin:.3em 0 .2em}
.card .sub{color:var(--mute);white-space:pre-line}
.meta{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:9px 0;margin:18px 0;font-size:.8rem}
.card img{width:100%;margin-bottom:16px;filter:grayscale(1)}
.card p{margin-bottom:1em;font-size:.95rem}
.x{position:absolute;top:10px;right:14px;font-size:1.8rem;line-height:1;background:none;border:0;cursor:pointer;color:var(--ink)}
.x:hover{color:var(--acc)}
footer{border-top:1px solid var(--ink);padding:18px clamp(20px,5vw,64px);font-size:.75rem;color:var(--mute)}
#coords{position:fixed;left:12px;bottom:12px;background:var(--ink);color:#fff;padding:8px 12px;font:.8rem monospace;display:none;z-index:30}
@media(max-width:820px){.lbl,.lead-line{display:none}.dot{transform:scale(2.3)}.item:hover .dot{transform:scale(3)}}
</style>
</head>
<body>
<header>
  <div class="kicker">Odenwaldstraße · Seckacher Straße</div>
  <h1>Jüdisches Leben in Kleineicholzheim</h1>
  <p class="lead">Häuser, Familien und Orte der jüdischen Gemeinde bis zum Zweiten Weltkrieg. Fahre mit der Maus über einen Punkt und öffne ihn per Klick.</p>
</header>

<div class="map">
<svg id="svg" viewBox="0 0 1530 934" role="group" aria-label="Karte von Kleineicholzheim">
  <g class="road" id="roads">
    <path stroke-width="1.2" stroke="#999" d="M740,131 L778,157 L766,214 L897,297 L905,380 L895,500 L840,560 L750,610 L730,600"/>
    <path stroke-width="1.2" stroke="#999" d="M740,131 L720,215 L705,255 L665,300 L630,320 L620,350 L645,410 L615,470 L568,545 L566,570"/>
    <path stroke-width="2" d="M338,5 C350,100 420,200 520,290 C580,340 620,350 640,370 C680,410 730,470 780,510 C830,560 860,600 850,650 C830,720 790,860 765,934"/>
    <path stroke-width="8" d="M795,5 C800,100 780,170 765,215 C730,260 705,290 715,340 C725,380 715,400 700,430 C690,470 700,500 695,540 C690,600 650,650 635,690 C610,760 580,830 575,934"/>
    <path stroke-width="6" d="M718,377 L920,375 C980,370 1010,358 1028,347"/>
    <path stroke-width="5" d="M595,527 L695,562 M595,527 L590,565 L588,645 L637,693"/>
  </g>
  <g id="items"></g>
</svg>
</div>

<section class="index"><h2>Verzeichnis</h2><ol id="list"></ol></section>
<footer>Ein Erinnerungsprojekt · Schematische Karte, nicht maßstabsgetreu</footer>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card" id="card"></div></div>
<div id="coords"></div>

<script src="houses.js"></script>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg'),items=document.getElementById('items');
const list=document.getElementById('list'),modal=document.getElementById('modal'),card=document.getElementById('card');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
let last=null;
HOUSES.forEach(h=>{
  const lines=[h.titel,...(h.untertitel?h.untertitel.split('\n'):[]),...(h.adresse?h.adresse.split('\n'):[])];
  const g=el('g',{class:'item',tabindex:0,role:'button','aria-label':h.titel+' – Details öffnen'});
  const w=Math.max(...lines.map(l=>l.length))*10.5+16;
  g.append(
    el('rect',{class:'hit',x:h.tx-8,y:h.ty-24,width:w,height:(lines.length+1)*29+4}),
    el('line',{class:'lead-line',x1:h.lx,y1:h.ly,x2:h.x,y2:h.y})
  );
  const t=el('text',{class:'lbl',x:h.tx,y:h.ty});
  lines.forEach((l,j)=>{const s=el('tspan',{x:h.tx,dy:j?29:0});if(!j)s.setAttribute('class','t');s.textContent=l;t.append(s)});
  const m=el('tspan',{class:'more',x:h.tx,dy:29});m.textContent='Mehr erfahren →';t.append(m);
  g.append(t,el('circle',{class:'ring',cx:h.x,cy:h.y,r:20}),el('circle',{class:'hit',cx:h.x,cy:h.y,r:26}),el('circle',{class:'dot',cx:h.x,cy:h.y,r:9}));
  g.onclick=()=>open(h,g);
  g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(h,g)}};
  items.append(g);
  const li=document.createElement('li');
  li.innerHTML=`<button>${esc(h.titel)}<small>${esc((h.adresse||'').replace(/\n/g,' · '))}</small></button>`;
  li.firstChild.onclick=()=>open(h,li.firstChild);list.append(li);
});
function open(h,from){
  last=from;
  const paras=(h.text||'').split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('');
  const meta=[(h.adresse||'').replace(/\n/g,' · '),h.jahre].filter(Boolean).join('   ·   ');
  card.innerHTML=`<button class="x" aria-label="Schließen">×</button><div class="k">${esc(h.kategorie)}</div>
  <h3 id="mt">${esc(h.titel)}</h3><div class="sub">${esc(h.untertitel)}</div>
  ${meta?`<div class="meta">${esc(meta)}</div>`:''}${h.foto?`<img src="${esc(h.foto)}" alt="${esc(h.titel)}">`:''}${paras}`;
  card.querySelector('.x').onclick=close;modal.classList.add('open');card.querySelector('.x').focus();
}
function close(){modal.classList.remove('open');last&&last.focus&&last.focus()}
modal.onclick=e=>{if(e.target===modal)close()};
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
if(location.search.includes('edit')){
  const c=document.getElementById('coords');c.style.display='block';c.textContent='Edit-Modus: auf die Karte klicken';
  svg.addEventListener('click',e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());c.textContent=`x:${Math.round(q.x)}, y:${Math.round(q.y)}`});
}
</script>
</body>
</html>
